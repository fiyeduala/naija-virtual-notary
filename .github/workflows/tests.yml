# Runs the automated tests on GitHub's own machines on every push to main and
# on every pull request, twice: once on SQLite and once on MySQL.
#
# This workflow never touches the live server. It has no deploy step, reads no
# secrets, and opens no connection to cPanel or the production database.
# The SQLite run uses a database held in memory (forced in phpunit.xml). The
# MySQL run uses a MySQL server that GitHub starts inside this job and
# destroys when the job ends (forced in phpunit.mysql.xml).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    services:
      # Started for both runs; the SQLite run simply never connects to it.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nvn_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: nvn-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, gd, zip, intl, bcmath, fileinfo
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('nvn-app/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare a test-only environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests on SQLite
        if: matrix.database == 'sqlite'
        run: vendor/bin/phpunit -c phpunit.xml

      - name: Run tests on MySQL
        if: matrix.database == 'mysql'
        run: vendor/bin/phpunit -c phpunit.mysql.xml
